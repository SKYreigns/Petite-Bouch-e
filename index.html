    <script>
      // Restore a deep link captured by public/404.html on static hosts.
      (function () {
        try {
          var redirect = sessionStorage.getItem('pb:redirect');
          if (!redirect) return;
          sessionStorage.removeItem('pb:redirect');
          var url = new URL(redirect);
          if (url.origin === window.location.origin) {
            window.history.replaceState(
              null,
              '',
              url.pathname + url.search + url.hash
            );
          }
        } catch (error) {
          // Ignore storage or URL errors and let the app render the home page.
        }
      })();
